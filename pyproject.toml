[project]
name = "dagnose"
version = "0.1.0"
description = "Open source AI on-call engineer for Apache Airflow: diagnoses failed tasks with evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "naresy" }]
keywords = ["airflow", "apache-airflow", "data-engineering", "on-call", "incident", "root-cause", "llm", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
# Managed Airflow and models in your own cloud. The Docker image includes all three.
aws = ["boto3>=1.35"]
gcp = ["google-auth[requests]>=2.30"]
azure = ["azure-identity>=1.17"]

[project.urls]
Homepage = "https://github.com/naresy/airflow_doctor"
Documentation = "https://github.com/naresy/airflow_doctor/blob/main/docs/install.md"
Issues = "https://github.com/naresy/airflow_doctor/issues"
Changelog = "https://github.com/naresy/airflow_doctor/blob/main/CHANGELOG.md"

[project.scripts]
dagnose = "dagnose.cli:app"

[project.entry-points."airflow.plugins"]
dagnose = "dagnose.plugin:DagnosePlugin"

[dependency-groups]
dev = [
    "azure-identity>=1.17",
    "boto3>=1.35",
    "google-auth[requests]>=2.30",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagnose"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # real log lines and URLs in fixtures
"src/dagnose/check.py" = ["E501"]  # user-facing help messages read better unsplit

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["airflow", "airflow.*", "boto3", "boto3.*", "botocore", "botocore.*", "google.*", "azure.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dagnose.plugin", "dagnose.plugin.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Airflow from dev/docker-compose.yml (DAGNOSE_IT=1)"]

[tool.coverage.run]
source = ["dagnose"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
