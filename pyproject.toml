[project]
name = "airflow-doctor"
version = "0.0.1"
description = "Open source AI on-call engineer for Apache Airflow"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.scripts]
airflow-doctor = "airflow_doctor.cli:app"

[project.entry-points."airflow.plugins"]
airflow_doctor = "airflow_doctor.plugin:AirflowDoctorPlugin"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_doctor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # real log lines and URLs in fixtures
"src/airflow_doctor/check.py" = ["E501"]  # user-facing help messages read better unsplit

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["airflow", "airflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["airflow_doctor.plugin", "airflow_doctor.plugin.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Airflow from dev/docker-compose.yml (AIRFLOW_DOCTOR_IT=1)"]

[tool.coverage.run]
source = ["airflow_doctor"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
