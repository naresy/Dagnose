name: release

# Push a tag like v0.1.0 (matching [project].version in pyproject.toml) to release.
# One-time setup: add this repository as a "trusted publisher" on PyPI
# (project airflow-doctor, workflow release.yml, environment pypi). No token needed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
